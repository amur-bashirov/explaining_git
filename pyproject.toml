[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package_of_amur"
version = "1.2.0"
description = "A demo package for explaining git and pip workflows"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
include = ["package_of_amur*"]